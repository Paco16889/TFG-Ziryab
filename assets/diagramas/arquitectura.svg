<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Arquitectura Ziryab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 40px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial; fill:#111827;}
      .h{font:700 24px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial; fill:#111827;}
      .t{font:500 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial; fill:#334155;}
      .s{font:500 16px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial; fill:#475569;}
      .xs{font:500 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial; fill:#64748b;}
      .box{fill:#ffffff; stroke:#e2e8f0; stroke-width:2;}
      .chip{fill:#eef2ff; stroke:#c7d2fe; stroke-width:1.5;}
      .render{fill:rgba(124,58,237,0.06); stroke:#c4b5fd; stroke-width:2; stroke-dasharray:10 10;}
      .accentP{stroke:#7c3aed;}
      .accentB{stroke:#3b82f6;}
      .arrow{stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round;}
      .arrowThin{stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round;}
      .dash{stroke-dasharray:10 10;}
    </style>
    <marker id="arrowP" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowB" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="72" text-anchor="middle" class="title">Arquitectura Ziryab</text>

  <!-- Clientes box -->
  <g filter="url(#shadow)">
    <rect x="80" y="130" rx="18" ry="18" width="430" height="190" class="box"/>
  </g>
  <text x="110" y="170" class="h">Clientes</text>
  <!-- simple browser icon -->
  <g transform="translate(110,190)">
    <rect x="0" y="0" width="70" height="54" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="0" y="0" width="70" height="14" rx="10" fill="#ddd6fe"/>
    <circle cx="12" cy="7" r="3" fill="#7c3aed"/>
    <circle cx="24" cy="7" r="3" fill="#3b82f6"/>
    <circle cx="36" cy="7" r="3" fill="#94a3b8"/>
  </g>
  <text x="200" y="222" class="h">Angular 19 SPA</text>
  <text x="200" y="252" class="t">Tailwind &#183; i18n (es/en/de)</text>
  <text x="200" y="280" class="xs">ziryabfront.onrender.com</text>

  <!-- Render container -->
  <g filter="url(#shadow)">
    <rect x="560" y="120" rx="22" ry="22" width="760" height="300" class="render"/>
  </g>
  <text x="600" y="170" class="h">Render (producci&#243;n)</text>

  <!-- API box inside Render -->
  <g filter="url(#shadow)">
    <rect x="650" y="200" rx="18" ry="18" width="580" height="170" class="box" stroke="#c7d2fe"/>
  </g>
  <text x="690" y="245" class="h">API Node.js + Express 5</text>
  <g transform="translate(690,265)">
    <rect x="0" y="0" rx="10" ry="10" width="190" height="34" class="chip"/>
    <text x="16" y="23" class="s">JWT &#183; Zod &#183; Swagger</text>
  </g>
  <text x="690" y="332" class="xs">ziryabback.onrender.com</text>

  <!-- Bottom services -->
  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="210" y="520" rx="18" ry="18" width="320" height="170" class="box"/>
  </g>
  <text x="250" y="568" class="h">PostgreSQL</text>
  <text x="250" y="600" class="t">Prisma ORM</text>
  <!-- db icon -->
  <g transform="translate(420,556)">
    <ellipse cx="60" cy="22" rx="48" ry="16" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2"/>
    <path d="M12,22 v60 c0,9 21,16 48,16 s48-7 48-16 v-60" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2"/>
    <ellipse cx="60" cy="82" rx="48" ry="16" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <!-- Firebase -->
  <g filter="url(#shadow)">
    <rect x="560" y="520" rx="18" ry="18" width="320" height="170" class="box"/>
  </g>
  <text x="600" y="568" class="h">Firebase Auth</text>
  <text x="600" y="600" class="t">Autenticaci&#243;n</text>
  <!-- cloud icon -->
  <g transform="translate(780,560)">
    <path d="M70 70c18 0 33-12 33-27 0-14-12-25-27-26C73 7 61 0 47 0 32 0 19 9 16 21 7 25 0 34 0 45 0 59 13 70 30 70h40z"
          fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  </g>

  <!-- Cloudinary -->
  <g filter="url(#shadow)">
    <rect x="910" y="520" rx="18" ry="18" width="320" height="170" class="box"/>
  </g>
  <text x="950" y="568" class="h">Cloudinary</text>
  <text x="950" y="600" class="t">Almacenamiento de archivos</text>
  <!-- cloud icon -->
  <g transform="translate(1130,560)">
    <path d="M70 70c18 0 33-12 33-27 0-14-12-25-27-26C73 7 61 0 47 0 32 0 19 9 16 21 7 25 0 34 0 45 0 59 13 70 30 70h40z"
          fill="#f0f9ff" stroke="#93c5fd" stroke-width="2"/>
    <path d="M52 18a18 18 0 1 1-28 22" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Arrows -->
  <!-- Angular -> API (HTTPS/REST) -->
  <path d="M510 230 C560 230 600 250 650 270" class="arrow accentB" marker-end="url(#arrowB)"/>
  <text x="555" y="214" class="xs" fill="#3b82f6">HTTPS / REST</text>

  <!-- API -> Angular (SSE) dashed -->
  <path d="M650 310 C600 330 560 350 510 350" class="arrowThin accentP dash" marker-end="url(#arrowP)"/>
  <text x="545" y="375" class="xs" fill="#7c3aed">SSE notificaciones en tiempo real</text>

  <!-- API -> PostgreSQL -->
  <path d="M940 370 C880 440 700 480 510 560" class="arrow accentB" marker-end="url(#arrowB)"/>

  <!-- API -> Firebase -->
  <path d="M980 370 C980 440 880 460 760 520" class="arrow accentP" marker-end="url(#arrowP)"/>
  <text x="935" y="460" class="xs" fill="#7c3aed">verificaci&#243;n tokens</text>

  <!-- API -> Cloudinary -->
  <path d="M1080 370 C1120 430 1130 460 1120 520" class="arrow accentB" marker-end="url(#arrowB)"/>
  <text x="1100" y="448" class="xs" fill="#3b82f6">subida ficheros</text>

  <!-- Angular -> Firebase (Auth tokens) curved -->
  <path d="M300 320 C380 420 520 470 650 520" class="arrowThin accentP" marker-end="url(#arrowP)"/>
  <text x="360" y="440" class="xs" fill="#7c3aed">Auth tokens</text>
</svg>
